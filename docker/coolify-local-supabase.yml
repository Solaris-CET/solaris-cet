services:
  frontend:
    build:
      context: /root/solaris-cet
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://solaris-cet.com}
        VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION:-}
        VITE_GIT_COMMIT_HASH: ${VITE_GIT_COMMIT_HASH:-local}
        VITE_BUILD_TIMESTAMP: ${VITE_BUILD_TIMESTAMP:-}
        GIT_SHA: ${GIT_SHA:-local}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      TONCENTER_RPC_URL: ${TONCENTER_RPC_URL:-}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_API_KEY_ENC: ${GROK_API_KEY_ENC:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_ENC: ${GEMINI_API_KEY_ENC:-}
      CET_AI_ENABLE_WEB: ${CET_AI_ENABLE_WEB:-0}
      CET_AI_WEB_ALLOWLIST: ${CET_AI_WEB_ALLOWLIST:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_API_KEY_ENC: ${TAVILY_API_KEY_ENC:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port=process.env.PORT||3000;fetch('http://127.0.0.1:'+port+'/health.json',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-solaris-local-supabase.entryPoints=http
      - traefik.http.routers.http-0-solaris-local-supabase.middlewares=redirect-to-https
      - traefik.http.routers.http-0-solaris-local-supabase.rule=Host(`${PUBLIC_DOMAIN:-solaris-cet.com}`) && PathPrefix(`/`)
      - traefik.http.routers.http-0-solaris-local-supabase.service=http-0-solaris-local-supabase
      - traefik.http.routers.https-0-solaris-local-supabase.entryPoints=https
      - traefik.http.routers.https-0-solaris-local-supabase.middlewares=gzip
      - traefik.http.routers.https-0-solaris-local-supabase.rule=Host(`${PUBLIC_DOMAIN:-solaris-cet.com}`) && PathPrefix(`/`)
      - traefik.http.routers.https-0-solaris-local-supabase.service=https-0-solaris-local-supabase
      - traefik.http.routers.https-0-solaris-local-supabase.tls=true
      - traefik.http.routers.https-0-solaris-local-supabase.tls.certresolver=letsencrypt
      - traefik.http.services.http-0-solaris-local-supabase.loadbalancer.server.port=3000
      - traefik.http.services.https-0-solaris-local-supabase.loadbalancer.server.port=3000
    networks:
      - coolify
networks:
  coolify:
    external: true
