# Stack minimal survey + platformă (fără postgres/redis).
# Din repo root: docker compose -f docker/docker-compose.survey.yml up --build
services:
  survey-engine:
    build:
      context: ../survey-engine
      dockerfile: Dockerfile
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
    volumes:
      - survey_output:/app/output
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      - PORT=3000
      - SURVEY_ENGINE_URL=http://survey-engine:8000
      - LEAD_STORAGE_DIR=/data/leads
    volumes:
      - leads_data:/data/leads
    ports:
      - "3000:3000"
    depends_on:
      survey-engine:
        condition: service_healthy

volumes:
  survey_output:
  leads_data: