services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL}
        VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION}
        VITE_GIT_COMMIT_HASH: ${VITE_GIT_COMMIT_HASH}
        VITE_BUILD_TIMESTAMP: ${VITE_BUILD_TIMESTAMP}
        GIT_SHA: ${GIT_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
    environment:
      - PORT=${PORT:-3000}
      - SURVEY_ENGINE_URL=http://survey-engine:8000
      - LEAD_STORAGE_DIR=/data/leads
      - DATABASE_URL=postgresql://${POSTGRES_USER:-solaris}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solaris_cet}
    volumes:
      - leads_data:/data/leads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      survey-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const port=process.env.PORT||3000;fetch('http://127.0.0.1:'+port+'/health.json',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  survey-engine:
    build:
      context: ../survey-engine
      dockerfile: Dockerfile
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
    volumes:
      - survey_output:/app/output
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-solaris_cet}
      - POSTGRES_USER=${POSTGRES_USER:-solaris}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  survey_output:
  leads_data:
