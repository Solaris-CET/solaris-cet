services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL}
        VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION}
        VITE_GIT_COMMIT_HASH: ${VITE_GIT_COMMIT_HASH}
        VITE_BUILD_TIMESTAMP: ${VITE_BUILD_TIMESTAMP}
        GIT_SHA: ${GIT_SHA}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP}
    environment:
      - PORT=${PORT:-3000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const port=process.env.PORT||3000;fetch('http://127.0.0.1:'+port+'/health.json',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-solaris_cet}
      - POSTGRES_USER=${POSTGRES_USER:-solaris}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
